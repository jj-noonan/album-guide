# Deploy from the repo root:  fly deploy
#
# Change `app` to whatever name `fly launch` gives you.
app = "seebugbus-api"
primary_region = "iad"

[build]
  dockerfile = "api/Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true

  # The catalog is read-only and low traffic, so machines stop when idle and
  # start on the next request. That is the difference between a few dollars a
  # month and a few cents; the cost is roughly a second on the first request
  # after a quiet spell.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    # Hits the database rather than just returning 200, so a machine serving a
    # missing or truncated file is reported unhealthy instead of silently
    # answering every query with nothing.
    path = "/v1/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  # 256 MB is comfortable: SQLite memory-maps the file and reads pages on
  # demand, so a 125 MB database does not need 125 MB of RAM.
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

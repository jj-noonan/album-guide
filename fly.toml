# Deploy from the repo root:  fly deploy
#
# `fly launch` rewrites this file and strips comments, so if you re-run it,
# restore these. The values below are what it generated; the notes are why.

app = 'album-guide-api'
primary_region = 'iad'

[build]
  dockerfile = 'api/Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true

  # The catalog is read-only and traffic is personal, so machines stop when
  # idle and start on the next request — the difference between a few dollars
  # a month and a few cents. The cost is roughly a second on the first request
  # after a quiet spell. Set min_machines_running = 1 to remove that.
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    # Counts rows rather than returning a bare 200, so a machine serving a
    # missing or truncated database is reported unhealthy instead of answering
    # every query with nothing.
    interval = '30s'
    timeout = '5s'
    # Startup builds the scoring pool over ~89,000 albums, which takes around
    # 25 seconds. A 10s grace period killed the machine before it could ever
    # answer.
    grace_period = '90s'
    path = '/v1/health'

[[vm]]
  # 512 MB, not 256.
  #
  # The database is memory-mapped and costs almost nothing, but the scoring
  # pool is ~89,000 Python objects and is not: the first deploy was OOM-killed
  # at 152 MB resident on a 256 MB machine. Slimming the pool took it from 296
  # MB to 231 MB, which would fit and would sit about 10% under the ceiling —
  # fragile, since the pool grows with every crawl. The headroom is worth more
  # than the dollar or so it costs.
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512

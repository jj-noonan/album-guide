<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>album.guide — a route through the albums you haven't found yet</title>
    <meta name="description" content="Music discovery that travels past the obvious. Pick a cover, take a turn, and see where the road goes." />

    <!-- Relative hrefs, not the absolute ones in the brand handoff.
         The site is served from a GitHub Pages subpath today, where /favicon/…
         resolves to the domain root and 404s. These work from a subpath and
         from album.guide once it exists, without a rebuild. -->
    <link rel="icon" href="./favicon/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />
    <meta name="theme-color" content="#185FA5" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="album.guide — a route through the albums you haven't found yet" />
    <meta property="og:description" content="Music discovery that travels past the obvious. Pick a cover, take a turn, and see where the road goes." />
    <!-- Pointed at where the site actually is. The handoff specifies
         https://album.guide/… but that domain is not registered yet, and a
         scraper cannot fetch an image from a domain that does not resolve —
         social previews would simply be blank. Swap both when it is live. -->
    <meta property="og:image" content="https://jj-noonan.github.io/seebugbus/social/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://jj-noonan.github.io/seebugbus/social/twitter-card.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
